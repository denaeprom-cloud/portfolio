
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🍅 土土时钟</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FFF5F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="土土时钟">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Kill ugly tap highlight on mobile */
  * {
    -webkit-tap-highlight-color: transparent;
    -webkit-focus-ring-color: transparent;
    outline: none;
  }

  /* Keep outline for keyboard accessibility, hide for mouse/touch */
  :focus:not(:focus-visible) { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  :root {
    --bg: #FFF5F0;
    --bg-card: #FFFFFF;
    --border: #F0E0D6;
    --text: #4A3728;
    --text-dim: #B0A098;
    --accent: #FF8C8C;
    --accent-soft: #FFF0F0;
    --accent-hover: #FF7070;
    --green: #7ECB9A;
    --green-soft: #F0FAF3;
    --yellow: #F5C063;
    --radius: 22px;
    --shadow: 0 4px 24px rgba(180, 140, 120, 0.1);
    --shadow-hover: 0 8px 32px rgba(180, 140, 120, 0.16);
    --font: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'PingFang SC', -apple-system, sans-serif;
  }


  html { height: 100%; }

  body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background 0.8s ease;
    background-image:
      radial-gradient(ellipse 280px 200px at 15% 10%, #FFE8E0 0%, transparent 70%),
      radial-gradient(ellipse 200px 300px at 85% 90%, #FFF0EB 0%, transparent 70%),
      radial-gradient(ellipse 240px 180px at 90% 5%, #FFEFEF 0%, transparent 70%),
      radial-gradient(ellipse 180px 240px at 5% 85%, #FFF5F0 0%, transparent 70%),
      radial-gradient(ellipse 300px 160px at 50% 50%, #FFFAF5 0%, transparent 60%);
    transition: background-color 0.8s ease, background-image 0.8s ease;
  }

  /* ===== Themed Backgrounds ===== */
  body[data-theme="focus"] {
    background-color: #F0F5FF;
    background-image:
      radial-gradient(ellipse 300px 200px at 20% 15%, #E0ECFF 0%, transparent 65%),
      radial-gradient(ellipse 220px 280px at 80% 85%, #E8F0FE 0%, transparent 65%),
      radial-gradient(ellipse 260px 180px at 85% 8%, #DCE8FF 0%, transparent 65%),
      radial-gradient(ellipse 200px 200px at 10% 80%, #EEF3FF 0%, transparent 65%),
      radial-gradient(ellipse 320px 140px at 50% 50%, #F5F8FF 0%, transparent 55%);
  }

  body[data-theme="short"] {
    background-color: #F0F8FC;
    background-image:
      radial-gradient(ellipse 280px 200px at 18% 12%, #E0F0FA 0%, transparent 65%),
      radial-gradient(ellipse 200px 260px at 82% 88%, #E8F4FC 0%, transparent 65%),
      radial-gradient(ellipse 240px 160px at 88% 6%, #DCEEF8 0%, transparent 65%),
      radial-gradient(ellipse 190px 220px at 8% 82%, #EFF6FB 0%, transparent 65%),
      radial-gradient(ellipse 300px 150px at 48% 48%, #F5FAFD 0%, transparent 55%);
  }

  body[data-theme="long"] {
    background-color: #F0FFF4;
    background-image:
      radial-gradient(ellipse 280px 200px at 16% 13%, #DCF5E4 0%, transparent 65%),
      radial-gradient(ellipse 210px 270px at 84% 86%, #E0F8E8 0%, transparent 65%),
      radial-gradient(ellipse 250px 170px at 86% 7%, #D8F4E0 0%, transparent 65%),
      radial-gradient(ellipse 180px 230px at 6% 84%, #ECFAF0 0%, transparent 65%),
      radial-gradient(ellipse 310px 145px at 50% 50%, #F5FFF8 0%, transparent 55%);
  }

  /* ===== Floating Decorations ===== */
  .bg-decorations {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .deco {
    position: absolute;
    animation: floatAround 18s ease-in-out infinite;
    opacity: 0.55;
  }

  .deco:nth-child(1)  { top: 5%; left: 8%; font-size: 2.2rem; animation-delay: 0s; animation-duration: 16s; }
  .deco:nth-child(2)  { top: 12%; right: 6%; font-size: 1.6rem; animation-delay: -4s; animation-duration: 20s; }
  .deco:nth-child(3)  { top: 75%; left: 4%; font-size: 2.8rem; animation-delay: -8s; animation-duration: 19s; }
  .deco:nth-child(4)  { top: 82%; right: 10%; font-size: 1.8rem; animation-delay: -12s; animation-duration: 22s; }
  .deco:nth-child(5)  { top: 35%; left: 92%; font-size: 2.0rem; animation-delay: -3s; animation-duration: 17s; }
  .deco:nth-child(6)  { top: 55%; left: 2%; font-size: 1.4rem; animation-delay: -15s; animation-duration: 21s; }
  .deco:nth-child(7)  { top: 48%; right: 3%; font-size: 2.4rem; animation-delay: -7s; animation-duration: 18s; }
  .deco:nth-child(8)  { top: 22%; left: 45%; font-size: 1.3rem; animation-delay: -10s; animation-duration: 23s; }
  .deco:nth-child(9)  { top: 68%; left: 55%; font-size: 1.9rem; animation-delay: -2s; animation-duration: 20s; }
  .deco:nth-child(10) { top: 90%; left: 40%; font-size: 2.5rem; animation-delay: -13s; animation-duration: 24s; }

  @keyframes floatAround {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
    25%  { transform: translate(18px, -22px) rotate(5deg) scale(1.15); }
    50%  { transform: translate(-10px, -8px) rotate(-3deg) scale(0.9); }
    75%  { transform: translate(-20px, 16px) rotate(4deg) scale(1.1); }
    100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  }

  /* Curvy corner lines */
  .corner-line {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    opacity: 0.25;
    transition: opacity 0.8s;
  }
  .corner-line.tl { top: -20px; left: -10px; }
  .corner-line.br { bottom: -10px; right: -10px; transform: rotate(180deg); }
  body[data-theme="long"] .corner-line { opacity: 0.3; }

  /* ===== App Shell ===== */
  .app {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 1.5rem;
    padding: 1.5rem;
    width: 100%;
    max-width: 880px;
    height: 100vh;
    max-height: 640px;
    will-change: transform;
  }

  .app.spring { transition: transform 0.45s cubic-bezier(0.25, 0.1, 0.25, 1); }

  /* ===== Panels ===== */
  .timer-panel, .task-panel {
    background: var(--bg-card);
    border: 2px solid transparent;
    border-radius: var(--radius);
    padding: 2rem 1.8rem;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s;
  }

  .timer-panel:hover, .task-panel:hover {
    box-shadow: var(--shadow-hover);
  }

  .timer-panel {
    flex: 1.2;
    align-items: center;
    justify-content: center;
    gap: 1.4rem;
    border-color: #FFE8E0;
  }

  .task-panel {
    flex: 0.9;
    gap: 1rem;
    overflow: hidden;
    border-color: #F0E8E0;
  }

  /* ===== Cute Title ===== */
  .cute-title {
    font-size: 1.4rem;
    font-weight: 800;
    color: #E8897C;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #FFB3A7, #FFA0C8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ===== Timer Ring ===== */
  .ring-container {
    position: relative;
    width: 240px;
    height: 240px;
    flex-shrink: 0;
    overflow: visible;
    transition: transform 1s cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  .ring-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    overflow: visible;
  }

  .ring-bg {
    fill: none;
    stroke: #F0E8E0;
    stroke-width: 8;
  }

  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke 0.5s, stroke-width 0.6s cubic-bezier(0.25, 0.1, 0.25, 1), filter 0.6s ease-out;
  }

  /* Per-theme ring stroke (uses SVG gradients) */
  body[data-theme="focus"] .ring-progress { stroke: url(#gradFocus); }
  body[data-theme="short"] .ring-progress { stroke: url(#gradShort); }
  body[data-theme="long"]  .ring-progress { stroke: url(#gradLong); }

  /* ===== Lead Dot ===== */
  .lead-dot {
    fill: #fff;
    stroke: var(--accent);
    stroke-width: 3;
    filter: drop-shadow(0 0 8px rgba(255,140,140,0.6));
    opacity: 0;
    transition: opacity 0.6s ease-out, stroke 0.5s, r 0.4s ease-out;
  }

  body[data-theme="short"] .lead-dot { stroke: #FFB3A7; fill: #FFF5F5; }
  body[data-theme="long"]  .lead-dot { stroke: #7ECB9A; fill: #F5FFF8; }

  .ring-container.running .lead-dot { opacity: 1; }

  /* ===== Ripple Rings (focus) ===== */
  .ripple-ring, .ripple-ring2 {
    fill: none;
    stroke: rgba(88,130,255,0.3);
    stroke-width: 2;
    opacity: 0;
    transition: opacity 0.5s ease-out;
  }

  body[data-theme="focus"] .ring-container.running .ripple-ring {
    animation: rippleOut 2s ease-out infinite;
  }
  body[data-theme="focus"] .ring-container.running .ripple-ring2 {
    animation: rippleOut 2s ease-out 1s infinite;
  }

  @keyframes rippleOut {
    0% { r: 92; opacity: 0.7; stroke-width: 3; }
    100% { r: 120; opacity: 0; stroke-width: 0.5; }
  }

  /* ===== Sparkle Dots ===== */
  .sparkle {
    fill: #fff;
    opacity: 0;
    transition: opacity 0.6s ease-out;
  }

  .ring-container.running .sparkle {
    animation: sparkleFloat 3s ease-in-out infinite;
  }
  .ring-container.running #sparkle2 { animation-delay: -1s; }
  .ring-container.running #sparkle3 { animation-delay: -2s; }

  @keyframes sparkleFloat {
    0%, 100% { opacity: 0; r: 2; }
    50%      { opacity: 0.8; r: 3.5; }
  }

  /* ===== Ring Container Animations per Mode ===== */

  /* Focus: shake + aggressive */
  body[data-theme="focus"] .ring-container.running {
    animation: focusShake 0.6s ease-in-out infinite;
  }

  @keyframes focusShake {
    0%, 100% { transform: rotate(0deg); }
    15%      { transform: rotate(1deg); }
    30%      { transform: rotate(-0.5deg); }
    45%      { transform: rotate(0.8deg); }
    60%      { transform: rotate(-0.3deg); }
    75%      { transform: rotate(0.3deg); }
  }

  body[data-theme="focus"] .ring-container.running .ring-progress {
    animation: focusStrokePulse 1.2s ease-in-out infinite;
  }

  @keyframes focusStrokePulse {
    0%, 100% { stroke-width: 8; }
    50%      { stroke-width: 13; }
  }

  /* Short break: bouncy scale */
  body[data-theme="short"] .ring-container.running {
    animation: shortBounce 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  }

  @keyframes shortBounce {
    0%, 100% { transform: scale(1); }
    30%      { transform: scale(1.06); }
    60%      { transform: scale(0.96); }
    80%      { transform: scale(1.03); }
  }

  body[data-theme="short"] .ring-container.running .ring-progress {
    animation: shortStrokeDance 2s ease-in-out infinite;
  }

  @keyframes shortStrokeDance {
    0%, 100% { stroke-width: 8; }
    25%      { stroke-width: 11; }
    75%      { stroke-width: 6; }
  }

  /* Long break: slow rotation driven by JS for smooth pause */

  body[data-theme="long"] .ring-container.running .ring-progress {
    animation: longStrokeGlow 3s ease-in-out infinite;
  }

  @keyframes longStrokeGlow {
    0%, 100% { stroke-width: 8; filter: drop-shadow(0 0 6px rgba(126,203,154,0.3)); }
    50%      { stroke-width: 11; filter: drop-shadow(0 0 16px rgba(126,203,154,0.55)); }
  }

  .timer-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .timer-time {
    font-family: var(--font-mono);
    font-size: 2.6rem;
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1;
    color: #5C3D2E;
  }

  .timer-label {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 0.5rem;
    transition: color 0.5s;
    font-weight: 600;
  }

  .timer-label.focus { color: var(--accent); }
  .timer-label.break { color: #5BAF7A; }

  /* ===== Controls ===== */
  .controls {
    display: flex;
    gap: 0.7rem;
  }

  .btn {
    padding: 0.7rem 1.8rem;
    border-radius: 50px;
    border: 2px solid #F0E0D6;
    background: #fff;
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(180,140,120,0.15);
  }
  .btn:active {
    transform: scale(0.94);
    transition: transform 0.1s;
  }

  .btn-start {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    min-width: 100px;
    box-shadow: 0 4px 16px rgba(255,140,140,0.25);
  }

  .btn-start:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    box-shadow: 0 6px 24px rgba(255,140,140,0.35);
  }

  .btn-start.running {
    background: #FFF8F0;
    border-color: var(--yellow);
    color: #C8960C;
    box-shadow: 0 4px 16px rgba(245,192,99,0.2);
  }
  .btn-start:active {
    transform: scale(0.92);
    transition: transform 0.1s;
  }

  .btn-reset {
    color: var(--text-dim);
    border-color: #F0E8E0;
  }
  .btn-reset:hover {
    color: var(--text);
    border-color: #E0D0C0;
  }

  /* ===== Mute Toggle ===== */
  .mute-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid #F0E0D6;
    background: #fff;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    font-family: var(--font);
    flex-shrink: 0;
  }

  .mute-btn:hover {
    border-color: #E0C8B8;
    box-shadow: 0 4px 16px rgba(180,140,120,0.15);
  }

  .mute-btn:active {
    transform: scale(0.85);
    transition: transform 0.1s;
  }

  .mute-btn.muted {
    background: #FFF0F0;
    border-color: #FFD4D4;
    animation: mutePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mute-btn.unmuted {
    background: #F0FFF4;
    border-color: #C8E8D4;
    animation: mutePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes mutePop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* ===== Phase Pills ===== */
  .phase-pills {
    display: flex;
    gap: 0.5rem;
    background: #FFF8F5;
    border-radius: 50px;
    padding: 0.35rem;
  }

  .phase-pill {
    padding: 0.45rem 1rem;
    border-radius: 50px;
    font-size: 0.78rem;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.25s;
    color: var(--text-dim);
    background: transparent;
    font-family: var(--font);
  }

  .phase-pill.active {
    background: #fff;
    color: var(--accent);
    box-shadow: 0 2px 8px rgba(180,140,120,0.12);
  }

  .phase-pill:hover:not(.active) {
    color: #8B6F5E;
    background: rgba(255,255,255,0.5);
  }
  .phase-pill:active {
    transform: scale(0.93);
    transition: transform 0.1s;
  }

  /* ===== Task Panel ===== */
  .task-panel h3 {
    font-size: 1.05rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-shrink: 0;
    color: #5C3D2E;
  }

  .task-input-wrap {
    display: flex;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .task-input {
    flex: 1;
    background: #FFFAF8;
    border: 2px solid #F0E4DC;
    border-radius: 50px;
    padding: 0.65rem 1rem;
    color: var(--text);
    font-size: 0.85rem;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
  }

  .task-input:focus { border-color: var(--accent); background: #fff; }
  .task-input::placeholder { color: #D0C4BC; }

  .btn-add {
    padding: 0.65rem 1.2rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 700;
    white-space: nowrap;
    font-family: var(--font);
    transition: all 0.2s;
  }
  .btn-add:hover {
    background: var(--accent-hover);
    box-shadow: 0 4px 16px rgba(255,140,140,0.25);
  }
  .btn-add:active {
    transform: scale(0.93);
    transition: transform 0.1s;
  }

  .task-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    padding-right: 0.3rem;
  }

  .task-list::-webkit-scrollbar { width: 5px; }
  .task-list::-webkit-scrollbar-thumb {
    background: #F0E0D8;
    border-radius: 10px;
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.6rem 0.8rem;
    border-radius: 50px;
    background: #FFFAF8;
    border: 2px solid transparent;
    transition: all 0.2s;
    animation: slideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .task-item:hover {
    border-color: #F0E0D6;
    background: #fff;
  }

  .task-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2.5px solid #E8D4C8;
    flex-shrink: 0;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
    background: #fff;
  }

  .task-check:hover { border-color: var(--green); }
  .task-check:active { transform: scale(0.85); transition: transform 0.1s; }

  .task-item.done .task-check {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
    animation: popCheck 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popCheck {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  .task-item.done .task-text {
    text-decoration: line-through;
    color: #C8B8A8;
  }

  .task-text {
    flex: 1;
    font-size: 0.88rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #5C3D2E;
  }

  .task-del {
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    color: #D0C0B8;
    cursor: pointer;
    border-radius: 50%;
    font-size: 0.75rem;
    opacity: 0;
    transition: all 0.2s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }

  .task-item:hover .task-del { opacity: 1; }
  .task-del:hover { color: #FF6B6B; background: #FFF0F0; }

  .task-empty {
    color: #D0C4BC;
    font-size: 0.82rem;
    text-align: center;
    padding: 2rem 0;
    font-weight: 600;
  }

  /* ===== Stats bar ===== */
  .stats-bar {
    display: flex;
    gap: 1.2rem;
    flex-shrink: 0;
    padding-top: 0.9rem;
    border-top: 2px solid #F5EAE4;
    font-size: 0.78rem;
    color: var(--text-dim);
    font-weight: 600;
  }

  .stats-bar span {
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .stats-bar .stat-val {
    color: #5C3D2E;
    font-weight: 800;
  }

  /* ===== Completion burst ===== */
  .burst {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: burstPop 1.2s ease-out forwards;
  }

  .burst-text {
    font-size: 4rem;
    animation: burstText 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    filter: drop-shadow(0 0 20px rgba(255,140,140,0.4));
  }

  @keyframes burstPop {
    0% { opacity: 1; }
    70% { opacity: 0.5; }
    100% { opacity: 0; }
  }

  @keyframes burstText {
    0% { transform: scale(0.2) rotate(-10deg); opacity: 1; }
    60% { transform: scale(1.3) rotate(3deg); opacity: 1; }
    100% { transform: scale(1.6) rotate(0deg); opacity: 0; }
  }

  /* ===== Confetti ===== */
  .confetti-piece {
    position: fixed;
    pointer-events: none;
    z-index: 200;
    animation: confettiFall 1.2s ease-in forwards;
  }

  @keyframes confettiFall {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.3); opacity: 0; }
  }

  /* ===== History Strip ===== */
  .history-strip {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
    padding-top: 0.7rem;
  }

  .history-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 0.68rem;
    color: var(--text-dim);
    font-weight: 600;
    min-width: 28px;
    cursor: default;
    transition: transform 0.2s;
  }

  .history-day.has-data {
    cursor: pointer;
  }

  .history-day.has-data:hover {
    transform: translateY(-3px);
  }

  .history-bar {
    width: 20px;
    min-height: 4px;
    border-radius: 10px;
    background: #F0E0D6;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .history-bar.active { background: var(--accent); }
  .history-day.today .history-bar { background: #FFB3A7; }
  .history-day.today { color: #E8897C; font-weight: 800; }

  /* ===== Day Detail Popup ===== */
  .day-detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(90, 55, 40, 0.25);
    z-index: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.2s ease;
    backdrop-filter: blur(4px);
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .day-detail-card {
    background: #fff;
    border-radius: 18px;
    padding: 1.6rem;
    width: 90%;
    max-width: 320px;
    box-shadow: 0 12px 40px rgba(140, 100, 70, 0.2);
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-height: 70vh;
    overflow-y: auto;
  }

  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .dd-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }

  .dd-date {
    font-weight: 800;
    font-size: 1rem;
    color: #5C3D2E;
  }

  .dd-close {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: #F5EAE4;
    color: #8B6F5E;
    font-size: 0.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .dd-close:hover { background: #FFE0D8; color: #E8897C; }

  .dd-stats {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
    font-size: 0.85rem;
    color: #8B6F5E;
  }

  .dd-stats b { color: #5C3D2E; }

  .dd-tasks-title {
    font-weight: 700;
    font-size: 0.85rem;
    color: #5C3D2E;
    margin-bottom: 0.6rem;
    padding-top: 0.8rem;
    border-top: 2px solid #F5EAE4;
  }

  .dd-task {
    padding: 0.45rem 0.7rem;
    margin-bottom: 0.35rem;
    background: #FFFAF8;
    border-radius: 10px;
    font-size: 0.84rem;
    color: #5C3D2E;
    font-weight: 600;
  }

  .dd-empty {
    color: #D0C4BC;
    font-size: 0.82rem;
    text-align: center;
    padding: 1rem 0;
  }

  /* ===== Notification hint ===== */
  .notify-hint {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    color: #5C3D2E;
    padding: 0.6rem 1.4rem;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 700;
    box-shadow: 0 6px 24px rgba(180,140,120,0.18);
    z-index: 300;
    animation: slideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
               fadeAway 0.3s 2s ease forwards;
    pointer-events: none;
  }

  @keyframes slideDown {
    from { transform: translateX(-50%) translateY(-40px); opacity: 0; }
    to   { transform: translateX(-50%) translateY(0); opacity: 1; }
  }

  @keyframes fadeAway {
    to { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  }

  /* ===== Install Button ===== */
  .install-btn {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1.2rem;
    background: linear-gradient(135deg, #FF8C8C, #FFB3A7);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--font);
    box-shadow: 0 4px 16px rgba(255, 140, 140, 0.3);
    animation: floatUpDown 2s ease-in-out infinite;
    transition: all 0.2s;
    flex-shrink: 0;
    align-self: center;
  }

  .install-btn:hover {
    box-shadow: 0 6px 24px rgba(255, 140, 140, 0.45);
    transform: translateY(-2px);
    animation: none;
  }

  @keyframes floatUpDown {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  /* ===== Install Guide Overlay ===== */
  .install-guide-overlay {
    position: fixed;
    inset: 0;
    background: rgba(90, 55, 40, 0.25);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.2s ease;
    backdrop-filter: blur(4px);
  }

  .install-guide-card {
    background: #fff;
    border-radius: 20px;
    padding: 1.8rem;
    width: 88%;
    max-width: 300px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(140, 100, 70, 0.2);
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .guide-step {
    padding: 0.55rem 0.8rem;
    margin-bottom: 0.4rem;
    background: #FFFAF8;
    border-radius: 12px;
    font-size: 0.85rem;
    color: #5C3D2E;
    text-align: left;
  }

  .install-guide-close {
    margin-top: 1rem;
    padding: 0.6rem 2rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--font);
  }

  /* ===== Responsive: Tablet ===== */
  @media (max-width: 780px) {
    .app {
      max-width: 100%;
      padding: 1rem;
      gap: 1rem;
    }
    .timer-panel, .task-panel { padding: 1.5rem 1.2rem; }
    .ring-container { width: 200px; height: 200px; }
    .timer-time { font-size: 2.2rem; }
  }

  /* ===== Responsive: Phone ===== */
  @media (max-width: 520px) {
    html { height: auto; }
    body {
      align-items: flex-start;
      overflow-y: auto;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
    }

    .app {
      flex-direction: column;
      max-height: none;
      height: auto;
      padding: 0.8rem;
      gap: 0.8rem;
    }

    /* Panels full-width */
    .timer-panel {
      padding: 1.4rem 1rem;
      gap: 1rem;
      border-radius: 18px;
    }

    .task-panel {
      padding: 1.2rem 1rem;
      gap: 0.8rem;
      border-radius: 18px;
      max-height: none;
      overflow: visible;
      min-height: 320px;
      flex: auto;
    }

    /* Smaller ring */
    .ring-container {
      width: 170px;
      height: 170px;
    }
    .timer-time { font-size: 2rem; }
    .timer-label { font-size: 0.78rem; }

    /* Compact title */
    .cute-title { font-size: 1.2rem; }

    /* Pill pills full-width scroll */
    .phase-pills {
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }
    .phase-pill {
      padding: 0.45rem 0.8rem;
      font-size: 0.75rem;
    }

    /* Larger touch targets */
    .btn {
      padding: 0.75rem 1.6rem;
      font-size: 0.9rem;
    }
    .btn-start { min-width: 110px; }

    /* Task list taller */
    .task-list { max-height: 280px; }

    /* Task items easier to tap */
    .task-check { width: 24px; height: 24px; }
    .task-item { padding: 0.65rem 0.8rem; }
    .task-del { opacity: 1; width: 30px; height: 30px; }

    /* Stats row wrap */
    .stats-bar { gap: 1rem; flex-wrap: wrap; font-size: 0.75rem; }

    /* History compact */
    .history-strip { gap: 4px; }
    .history-day { min-width: 24px; font-size: 0.62rem; }
    .history-bar { width: 16px; }

    /* Fewer floating decos on small screens */
    .deco:nth-child(n+7) { display: none; }
    .deco { font-size: 1.4rem !important; }

    /* Tappable task input */
    .task-input {
      padding: 0.7rem 1rem;
      font-size: 0.88rem;
    }
    .btn-add {
      padding: 0.7rem 1rem;
      font-size: 0.88rem;
    }

    /* Disable hover effects on touch */
    .task-item:hover { border-color: transparent; background: #FFFAF8; }
    .task-item:hover .task-del { opacity: 1; }
  }

  /* Prevent text zoom on double-tap */
  @media (pointer: coarse) {
    .btn, .btn-start, .btn-reset, .btn-add, .phase-pill, .task-check {
      touch-action: manipulation;
    }
  }
</style>
</head>
<body>

<!-- Floating cute decorations -->
<div class="bg-decorations" id="bgDecorations"></div>

<svg class="corner-line tl" width="140" height="140" viewBox="0 0 140 140"><path d="M0 70 Q0 0 70 0" fill="none" stroke="#FFD4C4" stroke-width="3" stroke-linecap="round"/><path d="M0 100 Q0 0 100 0" fill="none" stroke="#FFE0D0" stroke-width="2" stroke-linecap="round" opacity="0.6"/></svg>
<svg class="corner-line br" width="140" height="140" viewBox="0 0 140 140"><path d="M0 70 Q0 0 70 0" fill="none" stroke="#FFD4C4" stroke-width="3" stroke-linecap="round"/><path d="M0 100 Q0 0 100 0" fill="none" stroke="#FFE0D0" stroke-width="2" stroke-linecap="round" opacity="0.6"/></svg>

<div class="app">
  <!-- ===== Timer Panel ===== -->
  <div class="timer-panel">
    <div class="cute-title">🧸 土土时钟</div>
    <div class="phase-pills" id="phasePills">
      <button class="phase-pill active" data-mode="focus" data-min="40">🍅 专注</button>
      <button class="phase-pill" data-mode="short" data-min="5">☕ 小休</button>
      <button class="phase-pill" data-mode="long" data-min="15">🌿 长休</button>
    </div>

    <div class="ring-container" id="ringContainer">
      <svg class="ring-svg" viewBox="-10 -10 220 220">
        <defs>
          <!-- Focus: energetic blue-purple gradient -->
          <linearGradient id="gradFocus" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4A90FF">
              <animate attributeName="stop-color" values="#4A90FF;#7B5CFF;#4A90FF" dur="2s" repeatCount="indefinite"/>
            </stop>
            <stop offset="100%" stop-color="#7B5CFF">
              <animate attributeName="stop-color" values="#7B5CFF;#4A90FF;#7B5CFF" dur="2s" repeatCount="indefinite"/>
            </stop>
          </linearGradient>
          <!-- Short break: sky blue gradient -->
          <linearGradient id="gradShort" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7EC8E8">
              <animate attributeName="stop-color" values="#7EC8E8;#A8DFF0;#7EC8E8" dur="3s" repeatCount="indefinite"/>
            </stop>
            <stop offset="100%" stop-color="#A8DFF0">
              <animate attributeName="stop-color" values="#A8DFF0;#7EC8E8;#A8DFF0" dur="3s" repeatCount="indefinite"/>
            </stop>
          </linearGradient>
          <!-- Long break: fresh green gradient -->
          <linearGradient id="gradLong" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7ECB9A">
              <animate attributeName="stop-color" values="#7ECB9A;#5BC0BE;#7ECB9A" dur="4s" repeatCount="indefinite"/>
            </stop>
            <stop offset="100%" stop-color="#5BC0BE">
              <animate attributeName="stop-color" values="#5BC0BE;#7ECB9A;#5BC0BE" dur="4s" repeatCount="indefinite"/>
            </stop>
          </linearGradient>
        </defs>
        <!-- Energy ripple ring 1 (focus) -->
        <circle class="ripple-ring" cx="100" cy="100" r="92"/>
        <!-- Energy ripple ring 2 (focus) -->
        <circle class="ripple-ring2" cx="100" cy="100" r="92"/>
        <!-- Background track -->
        <circle class="ring-bg" cx="100" cy="100" r="92"/>
        <!-- Main progress ring -->
        <circle class="ring-progress" id="ringCircle" cx="100" cy="100" r="92"
                stroke-dasharray="578.053" stroke-dashoffset="0"/>
        <!-- Leading dot at the progress edge -->
        <circle class="lead-dot" id="leadDot" cx="100" cy="8" r="7"/>
        <!-- Orbiting sparkle dots -->
        <circle class="sparkle" id="sparkle1" cx="100" cy="12" r="3"/>
        <circle class="sparkle" id="sparkle2" cx="100" cy="12" r="2.5"/>
        <circle class="sparkle" id="sparkle3" cx="100" cy="12" r="3.5"/>
      </svg>
      <div class="timer-text">
        <div class="timer-time" id="timerDisplay">25:00</div>
        <div class="timer-label focus" id="timerLabel">准备就绪</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-start" id="btnStart" onclick="toggleTimer()">▶ 开始</button>
      <button class="btn btn-reset" onclick="resetTimer()">↺ 重置</button>
      <button class="mute-btn" id="muteBtn" onclick="toggleMute()" title="静音">🔊</button>
    </div>

    <div class="stats-bar">
      <span>🍅 <span class="stat-val" id="statPomos">0</span> 番茄</span>
      <span>⏱ <span class="stat-val" id="statMinutes">0</span> 分钟</span>
      <span>✅ <span class="stat-val" id="statTasks">0</span> 任务</span>
    </div>

    <div class="history-strip" id="historyStrip"></div>
    <div style="font-size:0.65rem;color:#D0C4BC;margin-top:2px;">tips:按 空格键 快速开始/暂停 ~~</div>

    <button class="install-btn" id="installBtn" style="display:none;" title="添加到桌面">
      📲 添加到桌面
    </button>
  </div>

  <!-- ===== Task Panel ===== -->
  <div class="task-panel">
    <h3>📋 今日待办</h3>
    <div class="task-input-wrap">
      <input class="task-input" id="taskInput" placeholder="添加新任务..." maxlength="60" onkeydown="if(event.key==='Enter')addTask()">
      <button class="btn-add" onclick="addTask()">+ 添加</button>
    </div>
    <div class="task-list" id="taskList">
      <div class="task-empty">👑 公主今日的日程</div>
    </div>
  </div>
</div>

<script>
  // ===== CONSTANTS =====
  const CIRCUMFERENCE = 2 * Math.PI * 92; // ~578.053
  const ringContainer = document.getElementById('ringContainer');
  const ringCircle = document.getElementById('ringCircle');
  const leadDot = document.getElementById('leadDot');
  const timerDisplay = document.getElementById('timerDisplay');
  const timerLabel = document.getElementById('timerLabel');
  const btnStart = document.getElementById('btnStart');
  const taskList = document.getElementById('taskList');
  const taskInput = document.getElementById('taskInput');

  // ===== MODE CONFIG =====
  const MODES = {
    focus:  { min: 40, label: '专注ing…',  idle: '准备开干！',    cls: 'focus' },
    short:  { min: 5,  label: '小憩一下...', idle: '浅浅休息会儿？', cls: 'break' },
    long:   { min: 15, label: '嘻嘻~~休息ing~~', idle: '好累呀。。。',    cls: 'break' },
  };

  // ===== STATE =====
  let mode = 'focus';        // 'focus' | 'short' | 'long'
  let totalSeconds = MODES.focus.min * 60;
  let remaining = totalSeconds;
  let intervalId = null;
  let rotInterval = null;
  let rotDeg = 0;
  let running = false;

  // ===== AUDIO =====
  let muted = false;
  let _audioCtx = null;

  function _getCtx() {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return _audioCtx;
  }

  // ===== HAPTIC =====
  function buzz(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
  }

  function toggleMute() {
    muted = !muted;
    const btn = document.getElementById('muteBtn');
    btn.textContent = muted ? '🔇' : '🔊';
    btn.className = 'mute-btn' + (muted ? ' muted' : ' unmuted');
    buzz(15);
    if (!muted) playClick();
  }

  function _tone(freq, type, vol, start, dur, glide) {
    if (muted) return;
    try {
      const ctx = _getCtx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g);
      g.connect(ctx.destination);
      o.type = type;
      o.frequency.setValueAtTime(freq, start);
      if (glide) o.frequency.linearRampToValueAtTime(freq + glide, start + dur);
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(vol, start + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, start + dur);
      o.start(start);
      o.stop(start + dur);
    } catch(e) {}
  }

  // Cute button click
  function playClick() {
    if (muted) return;
    buzz(10);
    const t = _getCtx().currentTime;
    _tone(1200, 'sine', 0.12, t, 0.08, -200);
  }

  // Cheerful start ding
  function playStart() {
    if (muted) return;
    buzz([30, 50, 30]);
    const t = _getCtx().currentTime;
    _tone(660, 'sine', 0.18, t, 0.12, 300);
    _tone(990, 'sine', 0.10, t + 0.06, 0.1, 200);
  }

  // Soft pause pop
  function playPause() {
    if (muted) return;
    buzz(20);
    const t = _getCtx().currentTime;
    _tone(440, 'sine', 0.13, t, 0.1, -200);
    _tone(280, 'sine', 0.08, t + 0.04, 0.08, -80);
  }

  // Happy task done boop
  function playTaskDone() {
    if (muted) return;
    buzz([40, 30, 40, 30, 40]);
    const t = _getCtx().currentTime;
    _tone(880, 'sine', 0.15, t, 0.1, 400);
    _tone(1320, 'sine', 0.10, t + 0.05, 0.08, 200);
  }

  // Bright task add pop
  function playTaskAdd() {
    if (muted) return;
    buzz(15);
    const t = _getCtx().currentTime;
    _tone(1040, 'sine', 0.14, t, 0.07, 300);
  }

  // Tiny task delete fwip
  function playTaskDel() {
    if (muted) return;
    buzz([10, 30, 10]);
    const t = _getCtx().currentTime;
    _tone(600, 'triangle', 0.10, t, 0.06, -300);
  }

  function playBeep() {
    if (muted) return;
    buzz([200, 100, 200, 100, 400]);
    try {
      const ctx = _getCtx();
      [0, 0.15, 0.3].forEach((delay, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(880 - i * 120, ctx.currentTime + delay);
        g.gain.setValueAtTime(0, ctx.currentTime + delay);
        g.gain.linearRampToValueAtTime(0.25, ctx.currentTime + delay + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.3);
        o.start(ctx.currentTime + delay);
        o.stop(ctx.currentTime + delay + 0.3);
      });
    } catch(e) {}
  }

  // ===== TIMER =====
  function setMode(newMode) {
    if (running) {
      stopRotation();
      pauseTimer();
    }
    mode = newMode;
    totalSeconds = MODES[mode].min * 60;
    remaining = totalSeconds;
    updateDisplay();
    updateRing();
    updateLabel();
    updatePhasePills();

    // Update theme
    document.body.setAttribute('data-theme', mode);
    renderDecorations();

    // Switch gradient and ring color
    const gradMap = { focus: 'url(#gradFocus)', short: 'url(#gradShort)', long: 'url(#gradLong)' };
    ringCircle.setAttribute('stroke', gradMap[mode]);
    ringCircle.classList.toggle('break', mode !== 'focus');
    leadDot.setAttribute('stroke', mode === 'focus' ? '#5B8FFF' : mode === 'short' ? '#FFB3A7' : '#7ECB9A');

    btnStart.textContent = '▶ 开始';
    btnStart.classList.remove('running');
    document.title = '🍅 Pomodoro';
  }

  function updatePhasePills() {
    document.querySelectorAll('.phase-pill').forEach(p => {
      p.classList.toggle('active', p.dataset.mode === mode);
    });
  }

  function updateDisplay() {
    const min = Math.floor(remaining / 60);
    const sec = remaining % 60;
    timerDisplay.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  function updateLabel() {
    const cfg = MODES[mode];
    timerLabel.textContent = running ? cfg.label : cfg.idle;
    timerLabel.className = 'timer-label ' + cfg.cls;
  }

  function updateRing() {
    const pct = 1 - remaining / totalSeconds;
    ringCircle.setAttribute('stroke-dashoffset', pct * CIRCUMFERENCE);

    // Update leading dot position
    const angle = 2 * Math.PI * pct - Math.PI / 2; // 12 o'clock start, clockwise
    const cx = 100, cy = 100, r = 92;
    const dx = cx + r * Math.cos(angle);
    const dy = cy + r * Math.sin(angle);
    leadDot.setAttribute('cx', dx);
    leadDot.setAttribute('cy', dy);

    // Position sparkles near leading edge with offsets
    const sparkleAngles = [0.3, -0.2, 0.5];
    [1, 2, 3].forEach((n, i) => {
      const sa = angle + sparkleAngles[i];
      const sparkle = document.getElementById('sparkle' + n);
      if (sparkle) {
        sparkle.setAttribute('cx', cx + r * Math.cos(sa));
        sparkle.setAttribute('cy', cy + r * Math.sin(sa));
      }
    });
  }

  function updateTitle() {
    const cfg = MODES[mode];
    const emoji = cfg.cls === 'focus' ? '🍅' : '☕';
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    const time = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    document.title = running ? `${time} ${emoji} ${cfg.label}` : '🍅 Pomodoro';
  }

  function tick() {
    if (remaining <= 0) {
      complete();
      return;
    }
    remaining--;
    updateDisplay();
    updateRing();
    updateTitle();
  }

  // ===== NOTIFICATION =====
  function notify(msg) {
    if (Notification.permission === 'granted') {
      new Notification('🍅 土土时钟', { body: msg, icon: '🍅' });
    }
  }

  function complete() {
    pauseTimer();
    playBeep();
    showBurst();
    notify(mode === 'focus' ? '专注完成！休息一下吧~' : '休息结束，继续加油！');

    if (mode === 'focus') {
      recordPomodoro();
    }
    // Auto-switch: focus → break, break → idle
    if (mode === 'focus') {
      const pomos = getTodayStats().completedPomodoros;
      // Every 4th pomodoro → long break
      setMode(pomos % 4 === 0 && pomos > 0 ? 'long' : 'short');
    } else {
      setMode('focus');
    }
  }

  function toggleTimer() {
    if (running) {
      playPause();
      pauseTimer();
    } else {
      playStart();
      startTimer();
    }
  }

  function startRotation() {
    if (mode !== 'long') return;
    rotDeg = 0;
    ringContainer.style.transform = 'rotate(0deg)';
    ringContainer.style.transition = 'none';
    // Force reflow so the reset above takes effect before we start stepping
    ringContainer.offsetHeight;
    ringContainer.style.transition = '';
    rotInterval = setInterval(() => {
      rotDeg += 0.8; // ~1 full rotation per 7.5s
      ringContainer.style.transform = `rotate(${rotDeg}deg)`;
      ringContainer.style.transition = 'transform 0.3s linear';
    }, 300);
  }

  function stopRotation() {
    if (rotInterval) { clearInterval(rotInterval); rotInterval = null; }
    // Smoothly rotate back to 0
    ringContainer.style.transition = 'transform 1.2s cubic-bezier(0.25, 0.1, 0.25, 1)';
    ringContainer.style.transform = 'rotate(0deg)';
  }

  function startTimer() {
    running = true;
    intervalId = setInterval(tick, 1000);
    updateRing(); // snap dot to current progress immediately
    btnStart.textContent = '⏸ 暂停';
    btnStart.classList.add('running');
    ringContainer.classList.add('running');
    startRotation();
    updateLabel();
    updateTitle();
  }

  function pauseTimer() {
    running = false;
    clearInterval(intervalId);
    intervalId = null;
    btnStart.textContent = '▶ 开始';
    btnStart.classList.remove('running');
    ringContainer.classList.remove('running');
    stopRotation();

    // Smooth-ring: set target values so CSS transitions ease back
    ringCircle.style.strokeWidth = '8';
    ringCircle.style.filter = 'drop-shadow(0 0 4px rgba(0,0,0,0.1))';

    updateLabel();
    document.title = '🍅 Pomodoro';
  }

  function resetTimer() {
    playClick();
    if (running) pauseTimer();
    remaining = totalSeconds;
    updateDisplay();
    updateRing();
    updateLabel();
    document.title = '🍅 Pomodoro';
  }

  function showBurst() {
    const el = document.createElement('div');
    el.className = 'burst';
    el.innerHTML = `<div class="burst-text">${mode === 'focus' ? '🍅' : '☕'}</div>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }

  // ===== DECORATIONS =====
  const DECOS = {
    focus: ['💪','🔥','⚡','🎯','🏆','🚀','💥','⭐','🌟','✨'],
    short: ['🌸','🎀','🧸','🍰','🫧','💖','🌷','🍪','🐣','💝'],
    long:  ['🌿','🍃','🌱','🦋','🌺','💚','🍀','🌈','☁️','🫧'],
  };

  function renderDecorations() {
    const container = document.getElementById('bgDecorations');
    if (!container) return;
    const emojis = DECOS[mode] || DECOS.short;
    container.innerHTML = emojis.map((e, i) =>
      `<span class="deco">${e}</span>`
    ).join('');
  }

  // ===== PHASE PILLS =====
  document.getElementById('phasePills').addEventListener('click', e => {
    const pill = e.target.closest('.phase-pill');
    if (!pill) return;
    playClick();
    setMode(pill.dataset.mode);
  });

  // ===== STATS =====
  function getTodayStats() {
    const today = new Date().toISOString().slice(0, 10);
    try {
      const raw = localStorage.getItem('pomodoro_stats');
      const data = JSON.parse(raw);
      if (data && data.date === today) return data;
    } catch(e) {}
    return { date: today, completedPomodoros: 0, totalFocusMinutes: 0 };
  }

  function saveStats(s) {
    localStorage.setItem('pomodoro_stats', JSON.stringify(s));
  }

  function recordPomodoro() {
    const s = getTodayStats();
    s.completedPomodoros++;
    s.totalFocusMinutes += MODES.focus.min;
    saveStats(s);
    renderStats();
  }

  function renderStats() {
    const s = getTodayStats();
    document.getElementById('statPomos').textContent = s.completedPomodoros;
    document.getElementById('statMinutes').textContent = s.totalFocusMinutes;
    const tasks = getTasks();
    const done = tasks.filter(t => t.done).length;
    document.getElementById('statTasks').textContent = `${done}/${tasks.length}`;
  }

  // ===== TASKS =====
  function getTasks() {
    try {
      const raw = localStorage.getItem('pomodoro_tasks');
      return JSON.parse(raw) || [];
    } catch(e) { return []; }
  }

  function saveTasks(tasks) {
    localStorage.setItem('pomodoro_tasks', JSON.stringify(tasks));
  }

  function addTask() {
    const text = taskInput.value.trim();
    if (!text) return;
    const tasks = getTasks();
    tasks.unshift({
      id: Date.now(),
      text,
      done: false,
      createdAt: new Date().toISOString().slice(0, 10),
    });
    saveTasks(tasks);
    taskInput.value = '';
    renderTasks();
    renderStats();
    playTaskAdd();
  }

  function toggleTask(id) {
    const tasks = getTasks();
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    t.done = !t.done;
    saveTasks(tasks);
    renderTasks();
    renderStats();
    saveDailySnapshot();
    renderHistory();
    if (t.done) { playTaskDone(); spawnConfetti(); }
    else { playClick(); }
  }

  function deleteTask(id) {
    playTaskDel();
    let tasks = getTasks();
    tasks = tasks.filter(t => t.id !== id);
    saveTasks(tasks);
    renderTasks();
    renderStats();
    saveDailySnapshot();
    renderHistory();
  }

  function renderTasks() {
    const tasks = getTasks();
    if (!tasks.length) {
      taskList.innerHTML = '<div class="task-empty">👑 公主今日的日程</div>';
      return;
    }
    taskList.innerHTML = tasks.map(t => `
      <div class="task-item ${t.done ? 'done' : ''}" data-id="${t.id}">
        <div class="task-check" onclick="toggleTask(${t.id})">${t.done ? '✓' : ''}</div>
        <span class="task-text">${escapeHtml(t.text)}</span>
        <button class="task-del" onclick="deleteTask(${t.id})">✕</button>
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  // ===== CONFETTI =====
  function spawnConfetti() {
    const emojis = ['⭐','🌟','✨','🎀','💖','🌸','🫧','🍀','💫','🎯'];
    for (let i = 0; i < 18; i++) {
      const el = document.createElement('span');
      el.className = 'confetti-piece';
      el.textContent = emojis[i % emojis.length];
      el.style.cssText = `
        left: ${50 + (Math.random()-0.5)*40}%;
        top: ${45 + (Math.random()-0.5)*30}%;
        --dx: ${(Math.random()-0.5)*300}px;
        --dy: ${Math.random()*200 + 80}px;
        --rot: ${(Math.random()-0.5)*720}deg;
        font-size: ${0.7 + Math.random()*1.4}rem;
        animation-delay: ${Math.random()*0.3}s;
        animation-duration: ${0.8 + Math.random()*1}s;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }
  }

  // ===== HISTORY =====
  function getHistory() {
    // Returns { "date": { pomos: N, minutes: N, tasksDone: N, tasks: [...] } }
    try {
      const raw = localStorage.getItem('pomodoro_history');
      return JSON.parse(raw) || {};
    } catch(e) { return {}; }
  }

  function saveHistory(h) {
    localStorage.setItem('pomodoro_history', JSON.stringify(h));
  }

  function saveDailySnapshot() {
    const today = new Date().toISOString().slice(0, 10);
    const ss = getTodayStats();
    const tasks = getTasks();
    const doneTasks = tasks.filter(t => t.done).map(t => t.text);
    const h = getHistory();
    h[today] = {
      pomos: ss.completedPomodoros,
      minutes: ss.totalFocusMinutes,
      tasksDone: doneTasks.length,
      tasksTotal: tasks.length,
      tasks: doneTasks,
    };
    saveHistory(h);
  }

  function recordPomodoro() {
    const s = getTodayStats();
    s.completedPomodoros++;
    s.totalFocusMinutes += MODES.focus.min;
    saveStats(s);

    saveDailySnapshot();
    renderStats();
    renderHistory();
  }

  function renderHistory() {
    const strip = document.getElementById('historyStrip');
    if (!strip) return;
    const h = getHistory();
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = d.toISOString().slice(0, 10);
      const entry = h[key];
      const count = (entry && entry.pomos) ? entry.pomos : (typeof entry === 'number' ? entry : 0);
      days.push({
        date: key,
        label: ['日','一','二','三','四','五','六'][d.getDay()],
        count,
        hasData: count > 0 || (entry && entry.tasksDone > 0),
        isToday: i === 0,
      });
    }
    const max = Math.max(1, ...days.map(d => d.count));
    strip.innerHTML = days.map(d => {
      const barH = Math.max(4, (d.count / max) * 40);
      return `<div class="history-day${d.isToday ? ' today' : ''}${d.hasData ? ' has-data' : ''}"
          onclick="showDayDetail('${d.date}')" title="点击查看详情">
        <div class="history-bar${d.count > 0 ? ' active' : ''}" style="height:${barH}px;"></div>
        ${d.label}
      </div>`;
    }).join('');
  }

  // ===== DAY DETAIL POPUP =====
  function showDayDetail(dateStr) {
    const h = getHistory();
    const entry = h[dateStr];
    const count = (entry && entry.pomos) ? entry.pomos : (typeof entry === 'number' ? entry : 0);
    const minutes = (entry && entry.minutes) || count * 25;
    const doneTasks = (entry && entry.tasks) || [];
    const tasksDone = doneTasks.length;
    const tasksTotal = (entry && entry.tasksTotal) || tasksDone;

    const d = new Date(dateStr + 'T00:00:00');
    const weekday = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    const month = d.getMonth() + 1;
    const day = d.getDate();

    const overlay = document.createElement('div');
    overlay.className = 'day-detail-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    let tasksHtml = '<div class="dd-empty">这天还没有记录哦~</div>';
    if (doneTasks.length > 0) {
      tasksHtml = doneTasks.map(t =>
        `<div class="dd-task">🌸 ${escapeHtml(t)}</div>`
      ).join('');
    }

    overlay.innerHTML = `
      <div class="day-detail-card">
        <div class="dd-header">
          <span class="dd-date">📅 ${month}月${day}日 ${weekday}</span>
          <button class="dd-close" onclick="this.closest('.day-detail-overlay').remove()">✕</button>
        </div>
        <div class="dd-stats">
          <span>🍅 <b>${count}</b> 番茄</span>
          <span>⏱ <b>${minutes}</b> 分钟</span>
          <span>✅ <b>${tasksDone}/${tasksTotal}</b> 任务</span>
        </div>
        <div class="dd-tasks-title">📋 完成的待办</div>
        ${tasksHtml}
      </div>
    `;
    document.body.appendChild(overlay);

    // Close with Escape
    const escHandler = (e) => { if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', escHandler); } };
    document.addEventListener('keydown', escHandler);
  }
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && document.activeElement !== taskInput) {
      e.preventDefault();
      toggleTimer();
    }
  });

  // ===== SWIPE GESTURE =====
  const MODE_ORDER = ['focus', 'short', 'long'];
  let swipeDX = 0, swipeStartX = 0, swipeStartY = 0, swiping = false;
  const SWIPE_THRESHOLD = 70;

  const appEl = document.querySelector('.app');

  appEl.addEventListener('touchstart', e => {
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    swipeDX = 0;
    swiping = false;
  }, { passive: true });

  appEl.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - swipeStartX;
    const dy = e.touches[0].clientY - swipeStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
      e.preventDefault();
      swiping = true;
      swipeDX = dx;
      appEl.style.transition = 'none';
      appEl.style.transform = `translateX(${dx * 0.5}px)`;
    }
  }, { passive: false });

  appEl.addEventListener('touchend', () => {
    if (!swiping) return;
    swiping = false;
    appEl.style.transition = 'transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1)';

    if (Math.abs(swipeDX) > SWIPE_THRESHOLD) {
      const idx = MODE_ORDER.indexOf(mode);
      const newIdx = swipeDX < 0 ? (idx + 1) % 3 : (idx + 2) % 3;
      setMode(MODE_ORDER[newIdx]);
      appEl.style.transform = '';
    } else {
      appEl.style.transform = '';
    }
  });

  // Prevent native swipe nav on mobile
  document.addEventListener('touchmove', e => {
    if (swiping) e.preventDefault();
  }, { passive: false });

  // Request notification permission on first interaction
  document.addEventListener('click', () => {
    if (Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }, { once: true });

  // ===== INIT =====
  ringCircle.style.strokeDasharray = CIRCUMFERENCE;
  ringCircle.style.strokeDashoffset = '0';
  ringCircle.setAttribute('stroke', 'url(#gradFocus)');
  document.body.setAttribute('data-theme', 'focus');
  renderDecorations();
  renderTasks();
  renderStats();
  renderHistory();
  updateDisplay();
</script>
<!-- PWA Service Worker -->
<script>
  // === Service Worker ===
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }

  // === Custom Install Button ===
  let deferredPrompt = null;

  // Always show button on mobile unless already standalone
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

  if (isMobile && !isStandalone) {
    const btn = document.getElementById('installBtn');
    if (btn) btn.style.display = 'flex';
  }

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
  });

  document.getElementById('installBtn').addEventListener('click', async () => {
    if (deferredPrompt) {
      // Native PWA install (Chrome, Edge, Samsung Browser, etc.)
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      const btn = document.getElementById('installBtn');
      if (outcome === 'accepted') {
        btn.textContent = '✅ 已添加';
        setTimeout(() => btn.style.display = 'none', 2000);
      }
      deferredPrompt = null;
    } else {
      // Fallback: show guide for browsers without PWA support
      showInstallGuide();
    }
  });

  function showInstallGuide() {
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isQQ = /QQBrowser|MQQBrowser/i.test(navigator.userAgent);

    let guideHTML;
    if (isQQ) {
      guideHTML = `<div class="guide-step">💡 QQ浏览器不支持一键安装</div>
        <div class="guide-step">📋 链接已复制</div>
        <div class="guide-step">🔗 请在 <b>Chrome浏览器</b> 中打开</div>`;
      try { navigator.clipboard.writeText(location.href); } catch(e) {}
    } else if (isIOS) {
      guideHTML = `<div class="guide-step">1️⃣ 点底部 <b>分享</b> 按钮</div>
        <div class="guide-step">2️⃣ 滑动找到 <b>添加到主屏幕</b></div>
        <div class="guide-step">3️⃣ 点右上角「添加」</div>`;
    } else {
      guideHTML = `<div class="guide-step">1️⃣ 点右上角 <b>⋮</b> 菜单</div>
        <div class="guide-step">2️⃣ 选择 <b>添加到主屏幕</b></div>
        <div class="guide-step">3️⃣ 确认添加即可</div>`;
    }

    const overlay = document.createElement('div');
    overlay.className = 'install-guide-overlay';
    overlay.onclick = ev => { if (ev.target === overlay) overlay.remove(); };
    overlay.innerHTML = `<div class="install-guide-card">
        <div style="font-size:2rem;margin-bottom:0.4rem;">📲</div>
        <div style="font-weight:800;font-size:1rem;color:#5C3D2E;margin-bottom:1rem;">添加到桌面</div>
        ${guideHTML}
        <button class="install-guide-close" onclick="this.closest('.install-guide-overlay').remove()">知道啦</button>
      </div>`;
    document.body.appendChild(overlay);
  }

  window.addEventListener('appinstalled', () => {
    const btn = document.getElementById('installBtn');
    if (btn) { btn.textContent = '✅ 已添加'; setTimeout(() => btn.style.display = 'none', 2000); }
  });
</script>
